[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."cleanup-reviewed-submission-files"]
  schedule = "0 19 * * *"

[functions."ai-assistant"]
  external_node_modules = ["pdfjs-dist"]
  included_files = ["node_modules/@napi-rs/canvas-linux-x64-gnu/**"]

[functions."ai-assistant-background"]
  external_node_modules = ["pdfjs-dist"]
  included_files = ["node_modules/@napi-rs/canvas-linux-x64-gnu/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
