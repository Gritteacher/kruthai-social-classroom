[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self' data: https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; frame-src 'self' blob: https://*.supabase.co; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.supabase.co; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; worker-src 'self' blob:"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."cleanup-reviewed-submission-files"]
  schedule = "0 19 * * *"

[functions."ai-assistant"]
  external_node_modules = ["pdfjs-dist"]
  included_files = ["node_modules/@napi-rs/canvas-linux-x64-gnu/**"]

[functions."ai-assistant-background"]
  external_node_modules = ["pdfjs-dist"]
  included_files = ["node_modules/@napi-rs/canvas-linux-x64-gnu/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
