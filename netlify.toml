[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."cleanup-reviewed-submission-files"]
  schedule = "0 19 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
